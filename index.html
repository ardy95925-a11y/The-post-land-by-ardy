<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Land</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Post Land</h2>
            <input type="email" id="auth-email" placeholder="Email address" autocomplete="email">
            <input type="password" id="auth-pass" placeholder="Password" autocomplete="current-password">
            <button class="btn" onclick="handleAuth('login')">Login</button>
            <button class="btn-secondary" onclick="handleAuth('signup')">Create Account</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- NAV -->
    <nav>
        <div class="nav-brand" onclick="showView('feed')">Post Land</div>
        <div class="nav-links">
            <button class="nav-btn" data-view="feed" onclick="showView('feed')">🏠</button>
            <button class="nav-btn" data-view="create" onclick="showView('create')">➕</button>
            <button class="nav-btn" data-view="dm" onclick="showView('dm')">
                ✉️ <span id="unread-badge" class="unread-badge hidden">0</span>
            </button>
            <button class="nav-btn danger" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- FEED -->
        <div id="feed-view">
            <div id="posts-list">
                <p style="text-align:center;color:#888;padding:40px;">Loading...</p>
            </div>
        </div>

        <!-- CREATE POST -->
        <div id="create-view">
            <div class="create-card">
                <h3>New Post</h3>
                <div style="position:relative;">
                    <textarea id="post-text" placeholder="What's on your mind?" maxlength="300"></textarea>
                    <span id="char-counter" class="char-counter">0 / 300</span>
                </div>
                <div class="image-upload-area">
                    <label for="post-image" class="image-upload-label">📷 Add Photo</label>
                    <input type="file" id="post-image" accept="image/*">
                    <button id="remove-image-btn" class="remove-img-btn hidden" onclick="removeImage()">✕ Remove</button>
                </div>
                <img id="image-preview" class="img-preview hidden" alt="Preview">
                <input type="text" id="post-tags" placeholder="Tags: news, tech, fun">
                <p id="upload-status" class="upload-status"></p>
                <button class="btn" id="upload-btn" onclick="uploadPost()">Publish</button>
            </div>
        </div>

        <!-- DMs -->
        <div id="dm-view">
            <div class="dm-container">

                <!-- INBOX LIST -->
                <div id="dm-inbox">
                    <div class="dm-header">
                        <h3>Messages</h3>
                    </div>
                    <div id="inbox-list">
                        <div class="dm-placeholder">
                            <div class="icon">✉️</div>
                            <p>No conversations yet.<br>Tap a username on a post to message them.</p>
                        </div>
                    </div>
                </div>

                <!-- ACTIVE CHAT -->
                <div id="chat-container" class="hidden">
                    <div class="dm-header">
                        <button class="dm-back-btn" onclick="backToDMList()">← Back</button>
                        <span id="chatting-with"></span>
                        <div></div>
                    </div>
                    <div id="msg-box"></div>
                    <div class="dm-input-row">
                        <input type="text" id="msg-input" placeholder="Type a message...">
                        <button class="send-btn" onclick="sendDM()">Send</button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script src="extras.js"></script>
</body>
</html>
