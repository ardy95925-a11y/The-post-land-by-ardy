<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Land</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH OVERLAY -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Post Land</h2>
            <input type="email" id="auth-email" placeholder="Email address" autocomplete="email">
            <input type="password" id="auth-pass" placeholder="Password" autocomplete="current-password">
            <button class="btn" onclick="handleAuth('login')">Login</button>
            <button class="btn-secondary" onclick="handleAuth('signup')">Create Account</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- NAV -->
    <nav>
        <div class="nav-brand" onclick="showView('feed')">Post Land</div>
        <div class="nav-links">
            <button class="nav-btn" data-view="feed" onclick="showView('feed')">🏠 Home</button>
            <button class="nav-btn" data-view="create" onclick="showView('create')">➕ Post</button>
            <button class="nav-btn" data-view="dm" onclick="showView('dm')">✉️ DMs</button>
            <button class="nav-btn danger" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- FEED -->
        <div id="feed-view">
            <div id="posts-list">
                <div id="loading">Loading posts...</div>
            </div>
        </div>

        <!-- CREATE POST -->
        <div id="create-view">
            <div class="create-card">
                <h3>New Post</h3>
                <textarea id="post-text" placeholder="What's on your mind?"></textarea>
                <input type="file" id="post-image" accept="image/*">
                <input type="text" id="post-tags" placeholder="Tags: news, tech, fun">
                <button class="btn" id="upload-btn" onclick="uploadPost()">Publish</button>
            </div>
        </div>

        <!-- DMs -->
        <div id="dm-view">
            <div class="dm-container">
                <div class="dm-header">
                    <h3>Direct Messages</h3>
                </div>

                <!-- Placeholder when no chat is open -->
                <div id="dm-placeholder" class="dm-placeholder">
                    <div class="icon">✉️</div>
                    <p>Tap a username on a post to start a chat</p>
                </div>

                <!-- Active chat -->
                <div id="chat-container" class="hidden">
                    <div class="dm-header">
                        <button class="dm-back-btn" onclick="backToDMList()">← Back</button>
                        <span id="chatting-with" style="font-weight:600; font-size:0.9rem;"></span>
                        <div></div>
                    </div>
                    <div id="msg-box"></div>
                    <div class="dm-input-row">
                        <input type="text" id="msg-input" placeholder="Type a message...">
                        <button class="send-btn" onclick="sendDM()">Send</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
