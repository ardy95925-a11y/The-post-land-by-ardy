<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialGlobe Online</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root { --primary: #0095f6; --bg: #fafafa; --border: #dbdbdb; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: var(--bg); padding-top: 70px; }
        .hidden { display: none !important; }

        /* Auth Screen */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; padding: 30px; border: 1px solid var(--border); border-radius: 8px; text-align: center; }

        /* Nav */
        nav { background: white; border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 100; }
        .nav-links button { background: none; border: none; cursor: pointer; padding: 8px 12px; font-weight: bold; font-size: 1.2rem; }

        /* Feed */
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .post { background: white; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        .post-header { padding: 12px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; }
        .post-img { width: 100%; display: block; border-bottom: 1px solid #f0f0f0; }
        .post-content { padding: 15px; }
        .tag { color: var(--primary); margin-right: 8px; font-weight: 500; }
        
        /* Inputs */
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* DMs */
        #msg-box { height: 400px; overflow-y: auto; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .msg { margin: 5px 0; padding: 8px 12px; border-radius: 15px; max-width: 80%; width: fit-content; }
        .msg.sent { background: var(--primary); color: white; margin-left: auto; }
        .msg.received { background: #e4e6eb; color: black; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>SocialGlobe</h2>
            <p style="color: #888; margin-bottom: 20px;">Login or create account</p>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-pass" placeholder="Password">
            <button class="btn" onclick="handleAuth('login')">Login</button>
            <button class="btn" onclick="handleAuth('signup')" style="background: #222;">Sign Up</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 15px;"></p>
        </div>
    </div>

    <nav>
        <div style="font-size: 1.4rem;"><strong>SocialGlobe</strong></div>
        <div class="nav-links">
            <button onclick="showView('feed')">🏠</button>
            <button onclick="showView('create')">➕</button>
            <button onclick="showView('dm')">✉️</button>
            <button onclick="logout()" style="font-size: 0.8rem; color: #999;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- FEED VIEW -->
        <div id="feed-view">
            <div id="posts-list">Loading SocialGlobe Feed...</div>
        </div>

        <!-- CREATE POST VIEW -->
        <div id="create-view" class="hidden">
            <div style="background: white; padding: 20px; border: 1px solid var(--border); border-radius: 8px;">
                <h3>New Post</h3>
                <textarea id="post-text" placeholder="Write news, thoughts, or updates..."></textarea>
                <label>Add Image:</label>
                <input type="file" id="post-image" accept="image/*">
                <input type="text" id="post-tags" placeholder="Tags (comma separated: news, globe, tech)">
                <button class="btn" id="upload-btn" onclick="uploadPost()">Share with Everyone</button>
            </div>
        </div>

        <!-- DM VIEW -->
        <div id="dm-view" class="hidden">
            <div id="chat-list-view">
                <h3>Messages</h3>
                <p style="color: #888; margin-bottom: 15px;">Click a username in the feed to start chatting.</p>
                <div id="recent-chats"></div>
            </div>
            
            <div id="chat-active-view" class="hidden">
                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <button onclick="closeChat()" style="background:none; border:none; color:var(--primary); cursor:pointer;">&larr; Back</button>
                    <h4 id="chatting-with-name" style="margin-left: 10px;">User</h4>
                </div>
                <div id="msg-box"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="Type a message...">
                    <button class="btn" style="width: 80px; margin-top: 8px;" onclick="sendDM()">Send</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // YOUR KEYS INTEGRATED
    const firebaseConfig = {
        apiKey: "AIzaSyDHD8A6I7hqECe5mg1XBb39HcFIu0tyB4c",
        authDomain: "social-globe.firebaseapp.com",
        projectId: "social-globe",
        storageBucket: "social-globe.firebasestorage.app",
        messagingSenderId: "986186459032",
        appId: "1:986186459032:web:6ab6ce3a2be54bcb04aded",
        measurementId: "G-FP1CJH5KF5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let user = null;
    let activeChatFriend = null;

    // --- AUTH ---
    function handleAuth(type) {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        const err = document.getElementById('auth-error');
        
        if (type === 'signup') {
            auth.createUserWithEmailAndPassword(email, pass).catch(e => err.innerText = e.message);
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => err.innerText = e.message);
        }
    }

    auth.onAuthStateChanged(u => {
        if (u) {
            user = u;
            document.getElementById('auth-overlay').classList.add('hidden');
            loadPosts();
        } else {
            document.getElementById('auth-overlay').classList.remove('hidden');
        }
    });

    function logout() { auth.signOut(); }

    // --- NAVIGATION ---
    function showView(view) {
        document.getElementById('feed-view').classList.add('hidden');
        document.getElementById('create-view').classList.add('hidden');
        document.getElementById('dm-view').classList.add('hidden');
        document.getElementById(`${view}-view`).classList.remove('hidden');
        if(view === 'feed') loadPosts();
    }

    // --- POSTS ---
    async function uploadPost() {
        const btn = document.getElementById('upload-btn');
        const text = document.getElementById('post-text').value;
        const tags = document.getElementById('post-tags').value.split(',').map(t => t.trim());
        const file = document.getElementById('post-image').files[0];
        
        if(!text) return alert("Write something first!");
        btn.innerText = "Posting..."; btn.disabled = true;

        let url = "";
        try {
            if(file) {
                const ref = storage.ref(`posts/${Date.now()}_${file.name}`);
                await ref.put(file);
                url = await ref.getDownloadURL();
            }

            await db.collection('posts').add({
                email: user.email,
                uid: user.uid,
                text: text,
                img: url,
                tags: tags,
                views: 0,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('post-text').value = "";
            document.getElementById('post-image').value = "";
            showView('feed');
        } catch (e) {
            alert("Error: " + e.message);
            console.error(e);
        }
        btn.innerText = "Share with Everyone"; btn.disabled = false;
    }

    function loadPosts() {
        db.collection('posts').orderBy('time', 'desc').onSnapshot(snap => {
            const list = document.getElementById('posts-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="post-header">
                        <span onclick="startChat('${p.email}')" style="color:var(--primary); cursor:pointer;">@${p.email.split('@')[0]}</span>
                        <span style="font-size:10px; color:#999;">${p.views || 0} views</span>
                    </div>
                    ${p.img ? `<img src="${p.img}" class="post-img" onclick="addView('${doc.id}', ${p.views||0})">` : ''}
                    <div class="post-content" onclick="addView('${doc.id}', ${p.views||0})">
                        <p>${p.text}</p>
                        <div style="margin-top:8px;">
                            ${p.tags ? p.tags.map(t => `<span class="tag">#${t}</span>`).join('') : ''}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }, err => console.error("Firestore Error:", err));
    }

    function addView(id, current) {
        db.collection('posts').doc(id).update({ views: current + 1 });
    }

    // --- DMs ---
    function startChat(email) {
        if(email === user.email) return;
        activeChatFriend = email;
        document.getElementById('chat-list-view').classList.add('hidden');
        document.getElementById('chat-active-view').classList.remove('hidden');
        document.getElementById('chatting-with-name').innerText = email;
        showView('dm');
        loadMessages();
    }

    function closeChat() {
        activeChatFriend = null;
        document.getElementById('chat-list-view').classList.remove('hidden');
        document.getElementById('chat-active-view').classList.add('hidden');
    }

    function sendDM() {
        const input = document.getElementById('msg-input');
        if(!input.value) return;
        db.collection('messages').add({
            from: user.email,
            to: activeChatFriend,
            msg: input.value,
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    function loadMessages() {
        db.collection('messages').orderBy('time', 'asc').onSnapshot(snap => {
            const box = document.getElementById('msg-box');
            box.innerHTML = "";
            snap.forEach(doc => {
                const m = doc.data();
                if((m.from === user.email && m.to === activeChatFriend) || (m.from === activeChatFriend && m.to === user.email)) {
                    const d = document.createElement('div');
                    d.className = `msg ${m.from === user.email ? 'sent' : 'received'}`;
                    d.innerText = m.msg;
                    box.appendChild(d);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }
</script>
</body>
</html>
